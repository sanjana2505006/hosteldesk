services:
  db:
    image: postgres:16
    container_name: hosteldesk-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: hosteldesk
      POSTGRES_PASSWORD: hosteldesk
      POSTGRES_DB: hosteldesk
    volumes:
      - hosteldesk_data:/var/lib/postgresql/data

volumes:
  hosteldesk_data:
