name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint, schema, build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://hosteldesk:hosteldesk@localhost:5433/hosteldesk?schema=public
      NEXTAUTH_SECRET: ci-build-secret
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npm run lint
      - name: Production build
        run: npm run build
